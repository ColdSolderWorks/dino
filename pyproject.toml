[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-editor"
version = "0.1.0"
description = "Windows-first FFmpeg + CustomTkinter video editor prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dino-editor = "dino_editor.app:main"
